<!DOCTYPE html>
<html lang="id">
  <head>
    <!-- Anti-flash: apply theme from localStorage BEFORE React renders to prevent white flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('astroc-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTROC - AI Career Intelligence &amp; Job Discovery Platform</title>
    <meta name="description" content="Platform Intelijen Karir Berbasis AI (Gemini Flash, Supabase pgvector &amp; Search Grounding). Evaluasi CV ATS/HR, Pencocokan Semantik Lowongan Kerja, &amp; Strategic Roadmap." />
    <meta name="keywords" content="ASTROC, AI Career, ATS Checker, Resume Evaluator, Job Search Grounding, pgvector, Gemini AI" />
    <meta name="author" content="Rayhan Abdul" />
    <meta name="theme-color" content="#050507" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astroc-career-platform.vercel.app/" />
    <meta property="og:title" content="ASTROC - AI Career Intelligence Platform" />
    <meta property="og:description" content="Evaluasi CV Berbasis Gemini AI, Matching Semantik pgvector, &amp; Rekomendasi Karir Otomatis." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&amp;auto=format&amp;fit=crop&amp;q=80" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ASTROC - AI Career Intelligence Platform" />
    <meta property="twitter:description" content="Evaluasi CV Berbasis Gemini AI &amp; Matching Semantik pgvector." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1200&amp;auto=format&amp;fit=crop&amp;q=80" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#050507] dark:text-slate-200 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
